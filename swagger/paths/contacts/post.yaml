tags:
  - Contacts
summary: Create new contact
description: Create new contact
operationId: createContact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - isFavourite
        properties:
          name:
            type: string
            example: Johnny Docker
            description: Contact`s name
          phoneNumber:
            type: string
            example: '+123456789'
            description: Contact`s phone
          contactType:
            type: string
            enum: ['work', 'personal', 'home']
            default: 'personal'
            example: 'personal'
            description: Contact`s type
          email:
            type: string
            example: myemail@gmail.com
            default: null
            description: Contact`s email
          isFavourite:
            type: boolean
            default: false
            example: false
            description: Is contact in favourite list
          photo:
            type: string
            format: binary
            description: Contact`s photo
responses:
  '200':
    description: 'Contact was created'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
